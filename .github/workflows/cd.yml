name: DevSecOps CD Pipeline

on:
  workflow_run:
    workflows: ["DevSecOps CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (defaults to git commit SHA)"
        required: false
        default: ""
      environment:
        description: "Target deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'devsecops-dev-eks' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'devsecops-platform' }}
  NAMESPACE: devsecops

jobs:
  deploy-to-eks:
    name: Deploy to Amazon EKS
    # Only run if triggered manually OR if the CI pipeline completed with success
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: 'v3.15.2'

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.30.0'

      - name: Determine Target Image Tag
        id: image_info
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG="${{ github.event.workflow_run.head_sha }}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "Selected Image Tag: $TAG"

      - name: Configure AWS Credentials via GitHub OIDC
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-CD-${{ github.run_id }}

      - name: Log in to Amazon ECR
        if: vars.AWS_ROLE_ARN != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update Kubeconfig for Amazon EKS
        if: vars.AWS_ROLE_ARN != ''
        run: |
          echo "Connecting to EKS cluster: ${{ env.EKS_CLUSTER_NAME }}"
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}
          kubectl cluster-info

      - name: Deploy Application with Helm
        if: vars.AWS_ROLE_ARN != ''
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Deploying devsecops-platform Helm chart to namespace: ${{ env.NAMESPACE }}"
          
          helm upgrade --install devsecops-platform helm/application \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set image.registry=$REGISTRY \
            --set image.repository=${{ env.ECR_REPOSITORY }} \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --wait \
            --timeout 5m0s

      - name: Verify Rollout Status
        if: vars.AWS_ROLE_ARN != ''
        run: |
          echo "Verifying Deployment rollout in namespace: ${{ env.NAMESPACE }}..."
          kubectl rollout status deployment/devsecops-platform -n ${{ env.NAMESPACE }} --timeout=180s
          
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=devsecops-platform
          
          echo "=== Services & Ingress ==="
          kubectl get svc,ingress -n ${{ env.NAMESPACE }}

      - name: Smoke Tests (Health & Readiness Validation)
        if: vars.AWS_ROLE_ARN != ''
        run: |
          echo "Running post-deployment smoke tests..."
          
          # Start port-forward in background for validation
          kubectl port-forward svc/devsecops-platform 8080:8080 -n ${{ env.NAMESPACE }} &
          PF_PID=$!
          
          # Give port-forward a moment to bind
          sleep 5
          
          # Validate Application Health & Readiness Endpoints
          echo "Checking /api/v1/health..."
          curl -s -f http://localhost:8080/api/v1/health || (kill $PF_PID && exit 1)
          
          echo "Checking /actuator/health..."
          curl -s -f http://localhost:8080/actuator/health || (kill $PF_PID && exit 1)
          
          # Terminate background port-forward
          kill $PF_PID
          echo "Smoke tests passed successfully!"

      - name: Kyverno Policy Compliance Check
        if: vars.AWS_ROLE_ARN != ''
        run: |
          echo "Checking Kyverno PolicyReport for namespace: ${{ env.NAMESPACE }}..."
          
          # Wait briefly for Kyverno background scans to complete
          sleep 10
          
          # Check for policy violations in the deployment namespace
          FAIL_COUNT=$(kubectl get policyreport -n ${{ env.NAMESPACE }} -o jsonpath='{.items[*].summary.fail}' 2>/dev/null | tr ' ' '\n' | awk '{s+=$1} END {print s+0}')
          
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "WARNING: $FAIL_COUNT Kyverno policy violation(s) detected!"
            kubectl get policyreport -n ${{ env.NAMESPACE }} -o yaml
            echo "Review the violations above and remediate."
            exit 1
          fi
          
          echo "Kyverno compliance check passed — no policy violations detected."

