name: DevSecOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'devsecops-platform' }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Build, Test & Code Quality
  # ---------------------------------------------------------------------------
  test-and-quality:
    name: Application Tests & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Maven Tests & Build
        run: |
          cd application
          ./mvnw clean verify

      - name: SonarCloud Code Analysis
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd application
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'omarwaziry_enterprise-aws-devsecops-platform' }} \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'omarwaziry' }} \
            -Dsonar.host.url=https://sonarcloud.io

  # ---------------------------------------------------------------------------
  # Stage 2: Security & Static Analysis (Trivy FS/IaC & Checkov)
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scanning (Trivy & Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan (Vulnerabilities & Secrets)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Run Trivy IaC Scan (Terraform & Helm Misconfigurations)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Run Checkov IaC Security Scan (Terraform, Helm & Dockerfile)
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform,helm,dockerfile
          output_format: cli
          soft_fail: false

  # ---------------------------------------------------------------------------
  # Stage 3: Container Build, Image Scan & ECR Push
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Docker Build, Scan & ECR Push
    needs: [test-and-quality, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Application Docker Image
        run: |
          docker build \
            -t devsecops-platform:${{ github.sha }} \
            -t devsecops-platform:latest \
            -f application/Dockerfile application

      - name: Run Trivy Container Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-platform:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Configure AWS Credentials (GitHub OIDC)
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker Image to Amazon ECR
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag devsecops-platform:${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag devsecops-platform:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Successfully pushed image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
