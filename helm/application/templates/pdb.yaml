{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "devsecops-platform.fullname" . }}
  labels:
    app: {{ include "devsecops-platform.name" . }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: {{ include "devsecops-platform.name" . }}
{{- end }}
