replicaCount: 2

image:
  # Registry URL (e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com). Leave empty for Docker Hub or when fully qualified in repository.
  registry: ""
  repository: devsecops-platform
  tag: "1.0.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

configMap:
  enabled: true
  data:
    SPRING_PROFILES_ACTIVE: "prod"
    LOGGING_LEVEL_ROOT: "INFO"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    path: /api/v1/ready
    initialDelaySeconds: 10
    periodSeconds: 10

  liveness:
    path: /actuator/health
    initialDelaySeconds: 20
    periodSeconds: 15

ingress:
  enabled: true
  className: alb
  scheme: internet-facing
  targetType: ip

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70