apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-namespaces
  annotations:
    policies.kyverno.io/title: Disallow Host Namespaces
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Using host namespaces (hostNetwork, hostPID, hostIPC) allows pods to
      access host-level resources and break container isolation boundaries.
      This policy prevents pods from using any host namespaces.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: deny-host-network
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          Using host network is not allowed. Set spec.hostNetwork to false
          or remove it entirely.
        pattern:
          spec:
            =(hostNetwork): "false"
    - name: deny-host-pid
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          Using host PID namespace is not allowed. Set spec.hostPID to false
          or remove it entirely.
        pattern:
          spec:
            =(hostPID): "false"
    - name: deny-host-ipc
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          Using host IPC namespace is not allowed. Set spec.hostIPC to false
          or remove it entirely.
        pattern:
          spec:
            =(hostIPC): "false"
