apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The ':latest' tag is mutable and can lead to unexpected behavior when
      images are updated. This policy requires that container images specify
      a tag and that the tag is not 'latest'.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          An image tag is required and must not be 'latest'.
          Use a specific version tag (e.g., v1.2.3 or a commit SHA).
        pattern:
          spec:
            containers:
              - image: "!*:latest & *:*"
    - name: validate-init-container-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          Init container image tags must not be 'latest'.
          Use a specific version tag.
        pattern:
          spec:
            =(initContainers):
              - image: "!*:latest & *:*"
