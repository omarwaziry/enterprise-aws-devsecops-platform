apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Requires all Deployments, StatefulSets, and DaemonSets to carry
      'app' and 'environment' labels for operational visibility and
      consistent resource management.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-for-labels
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
      validate:
        message: >-
          The label '{{request.object.metadata.labels | keys(@)}}' is missing
          required labels. All Deployments, StatefulSets, and DaemonSets must
          have 'app' and 'environment' labels.
        pattern:
          metadata:
            labels:
              app: "?*"
              environment: "?*"
