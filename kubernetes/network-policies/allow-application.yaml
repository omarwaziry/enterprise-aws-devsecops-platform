apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-application
  namespace: devsecops
spec:
  podSelector:
    matchLabels:
      app: devsecops-platform
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow traffic from the ALB / ingress controller
    - ports:
        - protocol: TCP
          port: 8080

  egress:
    # Allow DNS resolution (CoreDNS)
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow HTTPS to AWS services (ECR, Secrets Manager, STS, etc.)
    - ports:
        - protocol: TCP
          port: 443
